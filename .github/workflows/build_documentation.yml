name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

permissions: {}

jobs:
   build:
    # skip on forks, the secrets used below only exist in the main repo
    if: github.repository == 'huggingface/peft'
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@bc117cfbd874cbf27a80882e4676f4d06f2bb394  # main
    with:
      commit_sha: ${{ github.sha }}
      package: peft
      notebook_folder: peft_docs
    secrets:
      token: ${{ secrets.HUGGINGFACE_PUSH }}
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
